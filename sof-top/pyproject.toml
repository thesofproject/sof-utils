# SPDX-License-Identifier: BSD-3-Clause

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sof-top"
version = "0.1.0"
description = "SOF Top — GTK4 Live DSP Resource, Memory (SRAM + DRAM) & Task Monitor"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10"
authors = [
    { name = "Liam Girdwood", email = "liam.r.girdwood@intel.com" },
]
keywords = ["sof", "sound-open-firmware", "alsa", "dsp", "telemetry", "ipc4", "gtk4"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "PyGObject>=3.42.0",
    "pycairo>=1.20.0",
]

[project.urls]
Homepage = "https://github.com/thesofproject/sof-utils"
Repository = "https://github.com/thesofproject/sof-utils"
Issues = "https://github.com/thesofproject/sof-utils/issues"

[tool.setuptools]
py-modules = ["backend", "widgets_cairo"]
script-files = ["sof-top"]
